name: MySQL integration

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/mysql.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/mysql.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL 8.4 · ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [MysqlMigrationTest, QuotationApiIntegrationTest]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cadprint_test
          MYSQL_USER: cadprint
          MYSQL_PASSWORD: cadprint_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CADPRINT_TEST_MYSQL_USER: cadprint
      CADPRINT_TEST_MYSQL_PASSWORD: cadprint_ci
      TZ: UTC
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash mvnw -B "-Dtest=${{ matrix.test }}" test
        env:
          CADPRINT_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/cadprint_test?connectionTimeZone=UTC
