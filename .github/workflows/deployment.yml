name: Local deployment smoke test

on:
  pull_request:
    paths:
      - compose.yml
      - deploy/**
      - backend/**
      - frontend/**
      - .github/workflows/deployment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CADPRINT_DB_PASSWORD: test-db-password
      CADPRINT_MYSQL_ROOT_PASSWORD: test-root-password
      CADPRINT_ADMIN_PASSWORD: test-admin-password
      CADPRINT_OPERATOR_PASSWORD: test-operator-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: python3 deploy/smoke_test.py
      - run: |
          docker compose down
          docker compose up -d
          python3 deploy/smoke_test.py --after-restart
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        run: docker compose down
