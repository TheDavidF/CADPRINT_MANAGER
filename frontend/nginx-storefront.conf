server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / { return 302 /catalogo; }
    location = /catalogo { try_files /catalogo/index.html =404; }
    location = /catalogo/ { return 308 /catalogo; }

    location = /api/storefront {
        if ($request_method != GET) { return 405; }

        proxy_pass http://backend:8080/api/storefront;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
