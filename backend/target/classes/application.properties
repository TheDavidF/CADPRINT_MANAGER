spring.application.name=cadprint-manager
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/cadprint;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor},classpath:db/migration/common
spring.flyway.clean-disabled=true
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
cadprint.cors.allowed-origins=${CADPRINT_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
cadprint.product-images.directory=${CADPRINT_PRODUCT_IMAGES_DIRECTORY:./data/product-images}

cadprint.quotation-documents.directory=${CADPRINT_QUOTATION_DOCUMENTS_DIRECTORY:${user.home}/.cadprint/quotation-documents}
